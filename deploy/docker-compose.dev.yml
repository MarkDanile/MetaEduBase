services:
  postgres:
    # TD-047 切片 1: 走 metaedu/postgres-zhparser:pg16 镜像（含 zhparser + SCWS）
    # build 从 Dockerfile.postgres 构出；冷 build 首次会拉 apt 包 + 编译 SCWS + 编译 zhparser，5-10 min
    # builder 阶段从 host deploy/cache/ 离线拷贝 SCWS tarball + zhparser 源码（无需外网）
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres
    image: metaedu/postgres-zhparser:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: metaedu
      POSTGRES_USER: metaedu
      POSTGRES_PASSWORD: dev_only_123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaedu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: metaedu
      MINIO_ROOT_PASSWORD: dev_only_123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
