name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://metaedu:dev_only_123@localhost:5432/metaedu_test
      DATABASE_URL: postgresql+asyncpg://metaedu:dev_only_123@localhost:5432/metaedu_test
      JWT_SECRET_KEY: ci-only-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect change scopes
        id: scopes
        uses: ./.github/actions/change-scopes
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: No backend or MCP changes
        if: steps.scopes.outputs.backend != 'true' && steps.scopes.outputs.mcp != 'true'
        run: echo "Backend and MCP checks are not required for this change."

      - name: Select backend test scope
        id: backend_tests
        if: steps.scopes.outputs.backend == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            python3 scripts/ci/select_backend_tests.py \
              --all \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/select_backend_tests.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Reject empty backend test selection
        if: steps.scopes.outputs.backend == 'true' && steps.backend_tests.outputs.mode == 'none'
        run: |
          echo "Backend scope was active but no backend tests were selected." >&2
          exit 1

      - name: Install uv
        if: steps.scopes.outputs.backend == 'true' || steps.scopes.outputs.mcp == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            packages/server-python/uv.lock
            packages/mcp-server/uv.lock

      - name: Install Python 3.12 backend dependencies
        if: steps.scopes.outputs.backend == 'true'
        run: uv sync --project packages/server-python --python 3.12 --frozen --extra dev

      - name: Prepare pinned PostgreSQL build sources
        if: steps.scopes.outputs.backend == 'true'
        run: scripts/ci/prepare-postgres-sources

      - name: Set up Docker Buildx
        if: steps.scopes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build PostgreSQL test image
        if: steps.scopes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.postgres
          load: true
          tags: metaedu/postgres-zhparser:ci
          cache-from: type=gha,scope=metaedu-postgres
          cache-to: type=gha,mode=max,scope=metaedu-postgres

      - name: Start PostgreSQL
        if: steps.scopes.outputs.backend == 'true'
        run: |
          docker run --detach --rm \
            --name metaedu-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=metaedu \
            --env POSTGRES_USER=metaedu \
            --env POSTGRES_PASSWORD=dev_only_123 \
            metaedu/postgres-zhparser:ci
          for attempt in $(seq 1 30); do
            if docker exec metaedu-ci-postgres pg_isready -U metaedu -d metaedu; then
              sleep 3
              docker exec metaedu-ci-postgres pg_isready -U metaedu -d metaedu
              exit 0
            fi
            sleep 2
          done
          docker logs metaedu-ci-postgres
          exit 1

      - name: Initialize test database
        if: steps.scopes.outputs.backend == 'true'
        working-directory: packages/server-python
        run: uv run --frozen --extra dev python -m app.shared.infrastructure.test_db_setup

      - name: Ruff
        if: steps.scopes.outputs.backend == 'true'
        working-directory: packages/server-python
        run: uv run --frozen --extra dev ruff check .

      - name: mypy baseline
        if: steps.scopes.outputs.backend == 'true'
        working-directory: packages/server-python
        run: uv run --frozen --extra dev python scripts/check_mypy_baseline.py

      - name: Backend targeted PR tests
        if: >-
          steps.scopes.outputs.backend == 'true' &&
          steps.scopes.outputs.full != 'true' &&
          steps.backend_tests.outputs.mode == 'targeted'
        working-directory: packages/server-python
        env:
          PYTEST_PATHS: ${{ steps.backend_tests.outputs.pytest_paths }}
        run: |
          mapfile -t pytest_paths <<< "$PYTEST_PATHS"
          if [[ ${#pytest_paths[@]} -eq 0 ]]; then
            echo "Targeted mode returned an empty pytest path list." >&2
            exit 1
          fi
          echo "Backend targeted reason: ${{ steps.backend_tests.outputs.reason }}"
          uv run --frozen --extra dev pytest \
            -q -m "not external_network" --durations=20 "${pytest_paths[@]}"

      - name: Backend full hermetic tests
        if: >-
          steps.scopes.outputs.backend == 'true' &&
          steps.scopes.outputs.full != 'true' &&
          steps.backend_tests.outputs.mode == 'full'
        working-directory: packages/server-python
        run: uv run --frozen --extra dev pytest -q -m "not external_network" --durations=20

      - name: Backend scheduled hermetic tests
        if: steps.scopes.outputs.backend == 'true' && steps.scopes.outputs.full == 'true'
        working-directory: packages/server-python
        run: uv run --frozen --extra dev pytest -q -m "not external_network" --durations=20

      - name: Check MCP lockfile
        if: steps.scopes.outputs.mcp == 'true'
        run: uv lock --check --project packages/mcp-server

      - name: Install MCP Python 3.12 dependencies
        if: steps.scopes.outputs.mcp == 'true'
        run: uv sync --project packages/mcp-server --python 3.12 --frozen

      - name: MCP Ruff
        if: steps.scopes.outputs.mcp == 'true'
        working-directory: packages/mcp-server
        run: uv run --frozen ruff check .

      - name: MCP tests
        if: steps.scopes.outputs.mcp == 'true'
        working-directory: packages/mcp-server
        run: uv run --frozen pytest -q

      - name: PostgreSQL diagnostics
        if: failure() && steps.scopes.outputs.backend == 'true'
        run: docker logs metaedu-ci-postgres

      - name: Stop PostgreSQL
        if: always() && steps.scopes.outputs.backend == 'true'
        run: docker stop metaedu-ci-postgres || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect change scopes
        id: scopes
        uses: ./.github/actions/change-scopes
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: No frontend changes
        if: steps.scopes.outputs.frontend != 'true'
        run: echo "Frontend checks are not required for this change."

      - name: Install pnpm
        if: steps.scopes.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install Node.js
        if: steps.scopes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web typecheck

      - name: Lint
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web lint

      - name: Unit tests
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web test

      - name: Bundle
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web build:bundle

      - name: Install Playwright browsers
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web exec playwright install --with-deps chromium

      - name: E2E tests
        if: steps.scopes.outputs.frontend == 'true'
        run: pnpm --filter @metaedu/web test:e2e
        env:
          CI: "true"

  engineering-docs:
    name: Engineering docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change scopes
        id: scopes
        uses: ./.github/actions/change-scopes
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Engineering documentation gate
        run: scripts/check-engineering-docs --full

      - name: Install uv for engineering tests
        if: steps.scopes.outputs.engineering_tests == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: packages/server-python/uv.lock

      - name: Engineering infrastructure tests
        if: steps.scopes.outputs.engineering_tests == 'true'
        run: uv run --with pytest==8.4.2 python -m pytest tests/engineering -q

      - name: Whitespace gate
        run: git diff --check origin/main...HEAD
